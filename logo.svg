<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <!-- 天空渐变：从黎明到夜晚 -->
        <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFB88C" />   <!-- 黎明暖橘 -->
            <stop offset="15%" stop-color="#A8D8F0" />  <!-- 柔和过渡 -->
            <stop offset="35%" stop-color="#87CEEB" />  <!-- 清晨蓝 -->
            <stop offset="60%" stop-color="#4A90D9" />  <!-- 正午深蓝 -->
            <stop offset="80%" stop-color="#1E3A5F" />  <!-- 傍晚蓝灰 -->
            <stop offset="100%" stop-color="#0B1A2E" /> <!-- 夜晚深空 -->
        </linearGradient>

        <!-- 外圈金属渐变（低调银灰，不带白色高光） -->
        <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#94A3B8" />
            <stop offset="50%" stop-color="#64748B" />
            <stop offset="100%" stop-color="#334155" />
        </linearGradient>

        <!-- 指针渐变 -->
        <linearGradient id="handGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#E2E8F0" />
        </linearGradient>

        <!-- 指针阴影：仅在指针下方投一点，不扩散到背景 -->
        <filter id="handShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#0B1A2E" flood-opacity="0.5" />
        </filter>
    </defs>

    <!-- 外圈金属边框（不做白色描边） -->
    <circle cx="256" cy="256" r="238" fill="none" stroke="url(#ringGradient)" stroke-width="12" />

    <!-- 表盘背景：干净的天空渐变 -->
    <circle cx="256" cy="256" r="232" fill="url(#skyGradient)" />

    <!-- 指针：两个大小粗细完全相同（12px 宽 × 130px 长） -->
    <!-- 分针：指向 12 点钟方向 -->
    <rect x="250" y="126" width="12" height="130" fill="url(#handGradient)" filter="url(#handShadow)" />
    <!-- 时针：指向 3 点钟方向 -->
    <rect x="256" y="250" width="130" height="12" fill="url(#handGradient)" filter="url(#handShadow)" />

    <!-- 中心轴点 -->
    <circle cx="256" cy="256" r="6" fill="#0B1A2E" stroke="#FFFFFF" stroke-width="2" />
</svg>
